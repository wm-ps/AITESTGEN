[project]
name = "explorer-core"
version = "0.1.0"
description = "packages/explorer_core — Vantage Explorer's own tables (explorer_* prefix), shared by apps/api and apps/workers/explorer"
requires-python = ">=3.14"
dependencies = [
    "sqlmodel>=0.0.24",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/explorer_core"]
