[project]
name = "object-store"
version = "0.1.0"
description = "Object-storage abstraction for binary artifacts (screenshots, DOM snapshots) — shared by apps/workers/discovery (writer) and apps/api (reader)"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/object_store"]
