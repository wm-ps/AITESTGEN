[project]
name = "mailer"
version = "0.1.0"
description = "SMTP settings, Vantage email header/logo and one send function — shared by apps/api (invites, password resets) and apps/workers/execution (run-completed email)"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailer"]
