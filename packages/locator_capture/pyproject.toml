[project]
name = "locator-capture"
version = "0.1.0"
description = "Pure DOM/locator extraction utilities, shared by discovery_worker's live crawl and execution_worker's self-heal live inspection"
requires-python = ">=3.14"
dependencies = ["playwright>=1.57"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/locator_capture"]
