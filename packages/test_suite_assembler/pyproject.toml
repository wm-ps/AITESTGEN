[project]
name = "test-suite-assembler"
version = "0.1.0"
description = "TestAsset -> runnable Playwright project assembly, shared by apps/api's download endpoint and apps/workers/execution's Run All Tests path"
requires-python = ">=3.14"
dependencies = [
    "domain",
    "sqlmodel>=0.0.24",
]

[tool.uv.sources]
domain = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/test_suite_assembler"]
