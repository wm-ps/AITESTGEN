[project]
name = "playwright-typecheck"
version = "0.1.0"
description = "tsc --noEmit gate for generated/recorded Playwright specs, shared by generation-worker (LLM output) and apps/workers/recording (Codegen output)"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playwright_typecheck"]
