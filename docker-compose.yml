# Local-dev dependencies only (Story 1.1, Task 4) — dev ergonomics, NOT the
# deferred SaaS/on-prem Temporal-hosting or production-infra decision
# (architecture Deferred section).
services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aitestgen
    ports:
      - "5433:5432"
    # postgres:18+ images store data in a version-specific subdirectory and
    # expect the volume mounted at the parent /var/lib/postgresql, not the
    # pre-18 convention of /var/lib/postgresql/data directly (the latter
    # makes the 18+ entrypoint refuse to start, treating it as an
    # unsupported legacy layout).
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/admin-tools:1.31.2
    command: ["temporal", "server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233"   # gRPC frontend
      - "8233:8233"   # Web UI

  # Local-dev only (Story 1.3, Task 2) — file storage on the vault_data volume
  # so stored credentials survive a container/Docker restart (dev mode's
  # in-memory store silently orphaned every Application.secret_ref in
  # Postgres on each restart). scripts/vault/entrypoint.sh auto-inits/unseals
  # and keeps the same fixed `dev-only-root-token` + `secret/` KV v2 mount dev
  # mode used to provide, so nothing that talks to Vault changes. CI keeps
  # dev mode (ci.yml) — ephemeral is correct there. Not the deferred
  # production Vault-vs-cloud-KMS topology decision.
  vault:
    image: hashicorp/vault:1.18
    cap_add:
      - IPC_LOCK
    entrypoint: ["/bin/sh", "/vault/bootstrap/entrypoint.sh"]
    volumes:
      - vault_data:/vault/file
      - ./scripts/vault:/vault/bootstrap:ro
    ports:
      - "8200:8200"
    healthcheck:
      # `vault status` exits 0 only once unsealed — gates `up --wait`.
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Object storage (Story 2.2/2.8) points at real AWS S3 even for local dev
  # (AWS_S3_BUCKET/AWS_REGION/AWS creds in .env) — no local MinIO container.

  # Record and Play's recording service is a deliberate exception to every
  # other worker's "run natively via uv run" local-dev convention (see
  # scripts/dev-start.{sh,cmd}) — it depends on Xvfb/x11vnc, Linux-only
  # display-server tooling with no native-Windows equivalent, so it always
  # runs containerized, even here. Joins this same compose network to reach
  # postgres/vault by their in-network service names; the host reaches it
  # (and the browser reaches the websocket routes it exposes) via the
  # mapped port below.
  recording-worker:
    build:
      context: .
      dockerfile: apps/workers/recording/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/aitestgen
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-only-root-token
    ports:
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy

volumes:
  postgres_data:
  vault_data:
