# Non-secret config, shared across services. CORS_ALLOWED_ORIGINS starts as
# a placeholder — the real value (the web LoadBalancer's hostname) isn't
# known until after the web Service exists. Step 6 of the deploy runbook
# patches this ConfigMap once that hostname is available.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aitestgen-config
  namespace: aitestgen
data:
  CORS_ALLOWED_ORIGINS: "https://aitestgen-app.onwavemaker.com"
  FRONTEND_BASE_URL: "https://aitestgen-app.onwavemaker.com"
  AI_MODEL: "gpt-5.6-luna"
  AWS_S3_BUCKET: "wmps-ai-testgen"
  AWS_REGION: "us-east-1"
  TEMPORAL_ADDRESS: "temporal:7233"
  VAULT_ADDR: "http://vault:8200"
  # Postgres is externally hosted (e.g. RDS) — not deployed in-cluster.
  # Replace with the real endpoint; POSTGRES_PORT/POSTGRES_DB assume RDS
  # defaults, override here too if yours differ.
  POSTGRES_HOST: "44.193.88.55"
  POSTGRES_PORT: "8045"
  POSTGRES_DB: "aitestgen"
  POSTGRES_USER: "aitestgen"  
  # No TLS in front of the LoadBalancer Services yet (see README) — a
  # Secure cookie would never reach the browser over plain HTTP.
  # Flip to "true" only after HTTPS is in place (ACM cert + ALB Ingress,
  # or an NLB with a certificate) in front of the api Service.
  COOKIE_SECURE: "false"
  AI_TEMPERATURE: ""
  LITELLM_BASE_URL: "https://wmps-litellm.onwavemaker.com"

  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USER: "ps-tools@wavemaker.com"
  SMTP_FROM: "ps-tools@wavemaker.com"  
