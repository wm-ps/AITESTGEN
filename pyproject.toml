[tool.uv.workspace]
members = [
    "apps/api",
    "apps/workers/discovery",
    "apps/workers/generation",
    "apps/workers/execution",
    "apps/workers/recording",
    "packages/domain",
    "packages/workflows",
    "packages/ai_provider",
    "packages/delivery_adapters",
    "packages/ci_instructions",
    "packages/secrets_client",
    "packages/object_store",
    "packages/test_suite_assembler",
    "packages/safety_classifier",
    "packages/locator_capture",
    "packages/playwright_typecheck",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps", "packages"]

[tool.ruff]
target-version = "py314"
line-length = 100
# Lint only this platform's own source — not BMad tooling under .claude/ or _bmad/.
include = ["apps/**/*.py", "packages/**/*.py", "migrations/**/*.py"]
extend-exclude = [".claude", "_bmad", "migrations/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.14"
# Every app here deploys as a Linux container (see any Dockerfile) — this
# only matters for typeshed's platform-conditional stubs (os.killpg,
# signal.SIGKILL, ...), which recording_worker.display is the first module
# in this repo to actually use, since it always runs containerized, never
# natively on a dev machine's own OS (Record and Play plan §12).
pythonPlatform = "Linux"
include = [
    "apps/api",
    "apps/workers/discovery",
    "apps/workers/generation",
    "apps/workers/execution",
    "apps/workers/recording",
    "packages/domain",
    "packages/workflows",
    "packages/ai_provider",
    "packages/delivery_adapters",
    "packages/ci_instructions",
    "packages/secrets_client",
    "packages/object_store",
    "packages/test_suite_assembler",
    "packages/safety_classifier",
    "packages/locator_capture",
    "packages/playwright_typecheck",
]
