sonar.projectKey=aitestgen
sonar.projectName=AITestGen
sonar.sourceEncoding=UTF-8

# Monorepo (Python: apps/api, apps/workers/*, packages/*  |  TS/React: apps/web).
# sonar.sources and sonar.tests both point at the whole repo; sonar.test.inclusions
# reclassifies matching files as test code instead of maintaining a hand-enumerated
# list of every workspace member's src/ and tests/ path (new packages/apps then
# just work without editing this file).
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/tests/**,**/test_*.py,**/*_test.py,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

sonar.exclusions=\
  **/node_modules/**,\
  **/.venv/**,\
  **/dist/**,\
  **/build/**,\
  **/.vite/**,\
  **/htmlcov/**,\
  **/coverage/**,\
  **/.scannerwork/**,\
  **/*.gen.ts,\
  _bmad/**,\
  _bmad-output/**,\
  ops/**,\
  docs/**,\
  migrations/versions/**,\
  apps/workers/generation/typecheck/**

sonar.python.version=3.14

# Test coverage is intentionally not wired up yet (no pytest-cov / vitest
# coverage reports produced in CI) — add sonar.python.coverage.reportPaths /
# sonar.javascript.lcov.reportPaths once that's in place.
