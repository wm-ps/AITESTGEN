[project]
name = "execution-worker"
version = "0.1.0"
description = "apps/workers/execution — Temporal worker process for ApplicationTestExecutionWorkflow and its Activities (Run All Tests feature)"
requires-python = ">=3.14"
dependencies = [
    "temporalio>=1.9",
    "workflows",
    "domain",
    "secrets-client",
    "object-store",
    "test-suite-assembler",
    "ai-provider",
    "generation-worker",
    "locator-capture",
    "sqlmodel>=0.0.24",
    "psycopg[binary]>=3.2",
    # Self-heal live inspection (live_inspection.py) is the first in-process
    # Playwright use in this worker — everything else here shells out to
    # `npx playwright test` instead. Confined to that one module; see its
    # own docstring for why.
    "playwright>=1.57",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv.sources]
workflows = { workspace = true }
domain = { workspace = true }
secrets-client = { workspace = true }
object-store = { workspace = true }
test-suite-assembler = { workspace = true }
ai-provider = { workspace = true }
locator-capture = { workspace = true }
# Self-healing (HealTestActivity) reuses generation-worker's existing
# supersede_test_asset persistence helper and its tsc-based
# typecheck_playwright_code gate rather than duplicating a second
# Node/TypeScript typecheck toolchain (its own npm-installed node_modules)
# in this worker too — the first cross-worker-app dependency in this repo,
# made tractable by every worker's Dockerfile already `COPY . .`-ing the
# whole monorepo as its build context (see this worker's own Dockerfile).
generation-worker = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/execution_worker"]
