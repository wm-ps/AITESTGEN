<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <meta name="description" content="Vantage explores your web application, writes its tests with AI, runs them and keeps every suite in one place." />
    <title>Vantage</title>
    <!-- Signed-in hint (src/signedInHint.ts): hide a prerendered public page
         before first paint; main.tsx then shows the boot loader instead. -->
    <script>try{if(localStorage.getItem('vantage.signedIn')==='1')document.documentElement.setAttribute('data-signed-in-hint','')}catch(e){}</script>
    <style>[data-signed-in-hint] #root{visibility:hidden}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
