server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # `/` is the prerendered index.html and `/product` the prerendered
    # product.html (scripts/prerender.mjs); every other path is an SPA route
    # and falls back to the empty, noindex app shell.
    location / {
        try_files $uri $uri.html $uri/ /app.html;
    }
}
